<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arcadedu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen&family=Space+Mono&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display&family=Lora&family=Cinzel&family=EB+Garamond&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved skin + colour mode before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('arcadedu.theme.v1') || '{}').state || {}
        var mode = t.mode || 'system'
        if (mode === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.skin = t.skin || 'arcade'
        document.documentElement.dataset.theme = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
